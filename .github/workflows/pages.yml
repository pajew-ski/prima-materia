name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deployment needs to read the repository and mint an id-token for the
# Pages API; nothing here writes back to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are left to finish rather than
# cancelled, so a half-uploaded artefact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # The site publishes the ontology, so it is only ever built from a graph
      # that conforms — a red validation must not reach the namespace host.
      - run: python scripts/validate.py
      - run: pytest tests/

      - name: Build the site
        env:
          PRIMA_MATERIA_COMMIT: ${{ github.sha }}
        run: python scripts/publish.py --output build/site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
