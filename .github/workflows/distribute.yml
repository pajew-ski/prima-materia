name: Distribute

on:
  push:
    branches: [main]
  workflow_dispatch:

# Der Schreibschritt endet auf einem nackten git push ins Dist-Repo, ohne Retry.
# Zwei kurz hintereinander gemergte PR starten sonst zwei Laeufe, die dasselbe
# Dist-Repo zum selben Zeitpunkt ausgecheckt haben; der zweite scheitert
# non-fast-forward, und der Spiegel bleibt still auf dem aelteren Stand stehen.
# Abgebrochen wird hier nicht, aus demselben Grund wie in pages.yml: ein
# abgebrochener Pruefungslauf kostet nichts, ein abgebrochener Publikationslauf
# laesst den Spiegel zurueck. Siehe #353.
concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout dist
        uses: actions/checkout@v4
        with:
          repository: pajew-ski/prima-materia-dist
          path: dist
          token: ${{ secrets.DIST_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        working-directory: source
        run: pip install -r requirements.txt

      - name: Validate, compile, transmute
        working-directory: source
        run: |
          python scripts/validate.py
          python scripts/compile.py --output build/prima-materia.ttl
          python scripts/transmute.py \
            --input build/prima-materia.ttl \
            --context context/prima-materia-context.jsonld \
            --output build/prima-materia.jsonld

      - name: Sync artefacts to dist
        run: |
          cp source/build/prima-materia.ttl dist/prima-materia.ttl
          cp source/build/prima-materia.jsonld dist/prima-materia.jsonld
          cp source/context/prima-materia-context.jsonld dist/context.jsonld
          python - <<'PY'
          import json, os, subprocess, datetime
          sha = os.environ["GITHUB_SHA"]
          version = {
              "version": datetime.datetime.utcnow().strftime("%Y.%m.%d"),
              "git_sha": sha,
              "built_at": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
          }
          with open("dist/version.json", "w", encoding="utf-8") as fh:
              json.dump(version, fh, indent=2, sort_keys=True)
              fh.write("\n")

          # Der Spiegel darf nicht als Adresse gelesen werden: die Bezeichner
          # loesen auf den Namensraum-Host auf, und ein Repo ohne README sagt
          # das niemandem. Auto-generiert, damit hier niemand von Hand schreibt.
          readme = textwrap.dedent(f"""\
              # prima-materia-dist

              Auto-generated mirror. **Do not edit anything here by hand.** Every file is
              overwritten on each push to `main` of the source repository, and a manual
              change is lost without a trace.

              ## This is not the address

              The identifiers in this ontology resolve to <https://pajew.ski/prima-materia/>.
              That host carries the same serialisations, plus `llms.txt` and the
              independently loadable parts under `parts/`. This mirror exists for consumers
              that prefer to load from jsDelivr; it carries the complete serialisations and
              nothing else.

              ## Contents

              | File | What it is |
              |---|---|
              | `prima-materia.ttl` | the compiled ontology, Turtle |
              | `prima-materia.jsonld` | the same graph, JSON-LD |
              | `context.jsonld` | the JSON-LD context |
              | `version.json` | build date, source commit, build timestamp |

              ## Source, specification, issues

              <https://github.com/pajew-ski/prima-materia>

              Claims and findings are filed as issues there. Anyone may submit a claim
              without doing the research and without standing in a tradition.

              ## Licence

              CC0 1.0. Built from source commit `{sha}`.
              """)
          with open("dist/README.md", "w", encoding="utf-8") as fh:
              fh.write(readme)
          PY

      - name: Commit and push to dist
        working-directory: dist
        run: |
          git config user.name "prima-materia bot"
          git config user.email "bot@pajewski.net"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto-build from source@${GITHUB_SHA}"
            git push
          fi
