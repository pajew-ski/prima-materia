name: Validate

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Ein Arbeitsbranch bekommt mehrere Commits hintereinander, und nur der letzte
# Stand ist zu prüfen. Ohne diese Gruppe laufen alle parallel, der Branch wartet
# auf Läufe, deren Ergebnis schon überholt ist, und der Agent liest den falschen
# Zustand. Der PR-Lauf bekommt eine eigene Gruppe, damit ein Push auf den Branch
# ihn nicht abbricht.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Ein Push, der einen Ref erst erzeugt, prueft einen Commit, der auf seinem
    # Ursprungsbranch bereits geprueft ist. Der Lauf hat nie Aussagewert, haengt
    # aber am geerbten Kopf-SHA und erscheint deshalb als abgebrochener Check am
    # PR darunter. Siehe #352.
    if: ${{ !(github.event_name == 'push' && github.event.created) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: pytest tests/
