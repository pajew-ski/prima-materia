name: Validate

# Arbeitsbranches (claude/**) laufen nicht bei jedem Push. Ein Agent schreibt
# eine Aenderung ueber mehrere Commits, die Zwischenstaende sind planmaessig rot,
# und jeder davon endete als Fehlschlag mit Benachrichtigung an den Token-Inhaber.
# Geprueft wird nur der Stand, der PR werden soll: prima_repo_check stoesst den
# Lauf per workflow_dispatch an, wenn es fuer den Kopf-SHA keinen gibt. Siehe
# pajew-ski/data#337; damit entfallen auch #352 und #650.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ein zweiter Anstoss auf denselben Branch macht den ersten wertlos. Der PR-Lauf
# bekommt eine eigene Gruppe, damit ein Anstoss auf den Branch ihn nicht abbricht.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: pytest tests/
